      - name: Commit Hybrid v5 Source Files to Repository
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A project.yml README.md LichessCN/
            git commit -m "fix(v5): preserve Snabbdom DOM nodes for continuous move-by-move translation [skip ci]"
            git push origin HEAD || true
          fi

      - name: Select Xcode Stable
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen & ldid
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          if ! command -v ldid &> /dev/null; then
            brew install ldid
          fi

      - name: Generate Xcode Project via XcodeGen
        run: |
          xcodegen generate --spec project.yml

      - name: Build Unsigned Release App for iOS
        run: |
          xcodebuild clean build \
            -project LichessCN.xcodeproj \
            -scheme LichessCN \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            PRODUCT_BUNDLE_IDENTIFIER="com.lichess.studyapp" \
            INFOPLIST_KEY_CFBundleDisplayName="LichessStudy" \
            INFOPLIST_KEY_CFBundleName="LichessStudy" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Verify Pure ASCII Info.plist & Package LichessHybrid-v5.ipa
        run: |
          APP_PATH=$(find build/DerivedData -name "LichessCN.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: LichessCN.app not found!"
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleName LichessStudy" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName LichessStudy" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.lichess.studyapp" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion en" "$APP_PATH/Info.plist"

          rm -rf "$APP_PATH/embedded.mobileprovision"
          ldid -S "$APP_PATH/LichessCN" || codesign --force --deep --sign - "$APP_PATH"

          mkdir -p build/package/Payload
          cp -R "$APP_PATH" build/package/Payload/LichessCN.app
          cd build/package
          zip -r9 ../LichessHybrid-v5.ipa Payload
          cd ../..
          ls -lh build/LichessHybrid-v5.ipa

      - name: Publish LichessHybrid-v5.ipa to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.${{ github.run_number }}
          name: "LichessHybrid v5.0.${{ github.run_number }} (连续走子不漏译 & 底部横排修复版)"
          make_latest: true
          body: |
            ### 🚀 LichessHybrid v5.0 关键修复
            - **彻底解决走子后“有时完全不翻译”**：修复了 v4 中 `dataset.lcOrigText` 缓存与 `innerHTML` 覆盖导致 Lichess Snabbdom 虚拟 DOM 复用节点时无法检测新着法解说的问题；现在每走一步棋或点击「下一页」都会实时读取最新 DOM 文本并走高优先级通道秒级翻译。
            - **修复底部「轮到您走棋」被挤成竖排**：移除了对 `.gamebook .floor` 的强制 `display: flex` 覆盖，恢复正常横向排版。
            - **顶部新增一键重译按钮 (`🔄`)**：点击顶部工具栏的刷新图标可随时强制重译整页。
          files: |
            build/LichessHybrid-v5.ipa
