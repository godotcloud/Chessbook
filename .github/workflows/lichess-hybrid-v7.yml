      - name: Commit Hybrid v7 Source Files to Repository
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A project.yml README.md LichessCN/
            git commit -m "feat(v7): integrate comprehensive 220+ term chess glossary for unified terminology [skip ci]"
            git push origin HEAD || true
          fi

      - name: Select Xcode Stable
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen & ldid
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          if ! command -v ldid &> /dev/null; then
            brew install ldid
          fi

      - name: Generate Xcode Project via XcodeGen
        run: |
          xcodegen generate --spec project.yml

      - name: Build Unsigned Release App for iOS
        run: |
          xcodebuild clean build \
            -project LichessCN.xcodeproj \
            -scheme LichessCN \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            PRODUCT_BUNDLE_IDENTIFIER="com.lichess.studyapp" \
            INFOPLIST_KEY_CFBundleDisplayName="LichessStudy" \
            INFOPLIST_KEY_CFBundleName="LichessStudy" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Verify Pure ASCII Info.plist & Package LichessHybrid-v7.ipa
        run: |
          APP_PATH=$(find build/DerivedData -name "LichessCN.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: LichessCN.app not found!"
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleName LichessStudy" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName LichessStudy" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.lichess.studyapp" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion en" "$APP_PATH/Info.plist"

          rm -rf "$APP_PATH/embedded.mobileprovision"
          ldid -S "$APP_PATH/LichessCN" || codesign --force --deep --sign - "$APP_PATH"

          mkdir -p build/package/Payload
          cp -R "$APP_PATH" build/package/Payload/LichessCN.app
          cd build/package
          zip -r9 ../LichessHybrid-v7.ipa Payload
          cd ../..
          ls -lh build/LichessHybrid-v7.ipa

      - name: Publish LichessHybrid-v7.ipa to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.0.${{ github.run_number }}
          name: "LichessHybrid v7.0.${{ github.run_number }} (完整国际象棋术语库精译版)"
          make_latest: true
          body: |
            ### ♟️ LichessHybrid v7.0：完整国际象棋专业术语库深度集成
            - **彻底消除离谱直译**：
              - `White` / `Black` 严格译为 **白方 / 黑方**（复合词自动识别为 `白王/黑王`、`白格/黑格`、`白子/黑子`），告别“白人/黑人”。
              - `mate` / `checkmate` 严格译为 **将杀 / 杀棋**，告别“交配/配偶”。
              - `check` / `with check` / `in check` 严格译为 **将军 / 带将 / 被将军**（同时保留 `check out` -> `查看`），告别“检查/支票”。
            - **六大棋子译名 100% 前后统一**：全篇强制统一为 **王、后、车、象（含白格象/黑格象/双象）、马、兵（含通路兵/孤兵/叠兵/落后兵）**，告别“主教/骑士/城堡/菜鸟/女王/典当”混用。
            - **棋盘线格与战术专名规范化**：`square` -> `格`、`open file / e-file` -> `开放线 / e线`、`back rank` -> `底线`、`the exchange` -> `半子`。
          files: |
            build/LichessHybrid-v7.ipa
