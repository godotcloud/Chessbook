      - name: Commit Unpacked Project Files to Repository (Optional)
        if: github.event.inputs.commit_unpacked_sources != 'false'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add project.yml README.md LichessCN/
            git commit -m "chore: materialize LichessCN native iOS source files from all-in-one workflow [skip ci]"
            git push origin HEAD || true
          fi

      - name: Select Xcode Stable
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen & ldid
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          if ! command -v ldid &> /dev/null; then
            brew install ldid
          fi

      - name: Generate Xcode Project via XcodeGen
        run: |
          xcodegen generate --spec project.yml

      - name: Build Unsigned Release App for iOS
        run: |
          xcodebuild clean build \
            -project LichessCN.xcodeproj \
            -scheme LichessCN \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Fake-Sign with ldid & Package SideStore IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "LichessCN.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: LichessCN.app not found!"
            exit 1
          fi
          rm -rf "$APP_PATH/embedded.mobileprovision"
          ldid -S "$APP_PATH/LichessCN" || codesign --force --deep --sign - "$APP_PATH"

          mkdir -p build/package/Payload
          cp -R "$APP_PATH" build/package/Payload/LichessCN.app
          cd build/package
          zip -r9 ../LichessCN-SideStore.ipa Payload
          cd ../..
          ls -lh build/LichessCN-SideStore.ipa

      - name: Generate SideStore Direct Source JSON
        run: |
          IPA_SIZE=$(stat -f%z build/LichessCN-SideStore.ipa)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO_OWNER="${GITHUB_REPOSITORY_OWNER}"
          TAG_NAME="v1.0.${GITHUB_RUN_NUMBER}"

          cat <<EOF > build/sidestore-source.json
          {
            "name": "LichessCN SideStore Source",
            "identifier": "org.lichesscn.repo",
            "subtitle": "Lichess iOS 原生版（研习实时中文翻译）",
            "description": "纯原生 SwiftUI 开发的 Lichess 客户端，支持研习实时多引擎中文翻译、在线对局、战术谜题与云端引擎分析。",
            "apps": [
              {
                "name": "Lichess研习中文版",
                "bundleIdentifier": "org.lichesscn.app",
                "developerName": "${REPO_OWNER}",
                "subtitle": "Lichess 原生客户端 & 研习实时中文翻译",
                "localizedDescription": "支持导入/浏览 Lichess 研习并实时翻译棋评（内置 Pollinations AI 大模型、Lingva、MyMemory 免配置翻译引擎与国际象棋专业术语词库），支持在线对局、每日战术谜题与 Stockfish 云端分析。",
                "iconURL": "https://lichess1.org/assets/logo/lichess-favicon-512.png",
                "versions": [
                  {
                    "version": "1.0.${GITHUB_RUN_NUMBER}",
                    "date": "${BUILD_DATE}",
                    "localizedDescription": "GitHub Actions 免解压直装构建 (#${GITHUB_RUN_NUMBER})",
                    "downloadURL": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/LichessCN-SideStore.ipa",
                    "size": ${IPA_SIZE},
                    "minOSVersion": "16.0"
                  }
                ]
              }
            ]
          }
          EOF

      - name: Publish Direct Download IPA to GitHub Releases (No Artifact Zip Wrapper)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "LichessCN v1.0.${{ github.run_number }} (免解压直装 SideStore IPA)"
          make_latest: true
          body: |
            ### 📲 免解压直装说明 (iPhone / iPad)
            - **直接下载 `.ipa` 安装**：点击下方 Assets 中的 **`LichessCN-SideStore.ipa`**（GitHub Releases 提供原生 `.ipa` 直链，无需像 Artifacts 那样二次解压 `.zip`），下载后在 **SideStore** -> **My Apps** -> 左上角 `+` 选择该文件即可签名安装。
            - **SideStore 软件源直链**：复制下方 `sidestore-source.json` 的下载链接并添加至 SideStore **Sources**，即可直接在线安装与更新。
          files: |
            build/LichessCN-SideStore.ipa
            build/sidestore-source.json
