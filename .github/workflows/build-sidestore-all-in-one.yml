name: Build SideStore IPA (All-in-One Zero-Unzip)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      commit_unpacked_sources:
        description: '是否将自动释放的 Swift 源码提交回仓库分支'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  build-and-release-ipa:
    name: Auto-Generate Source, Build & Release Raw IPA
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

