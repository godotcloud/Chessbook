      - name: Commit Hybrid v6 Source Files to Repository
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A project.yml README.md LichessCN/
            git commit -m "feat(v6): add auto and manual Chinese TTS speech reader with chess notation verbalizer [skip ci]"
            git push origin HEAD || true
          fi

      - name: Select Xcode Stable
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen & ldid
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          if ! command -v ldid &> /dev/null; then
            brew install ldid
          fi

      - name: Generate Xcode Project via XcodeGen
        run: |
          xcodegen generate --spec project.yml

      - name: Build Unsigned Release App for iOS
        run: |
          xcodebuild clean build \
            -project LichessCN.xcodeproj \
            -scheme LichessCN \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            PRODUCT_BUNDLE_IDENTIFIER="com.lichess.studyapp" \
            INFOPLIST_KEY_CFBundleDisplayName="LichessStudy" \
            INFOPLIST_KEY_CFBundleName="LichessStudy" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Verify Pure ASCII Info.plist & Package LichessHybrid-v6.ipa
        run: |
          APP_PATH=$(find build/DerivedData -name "LichessCN.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: LichessCN.app not found!"
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleName LichessStudy" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName LichessStudy" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.lichess.studyapp" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion en" "$APP_PATH/Info.plist"

          rm -rf "$APP_PATH/embedded.mobileprovision"
          ldid -S "$APP_PATH/LichessCN" || codesign --force --deep --sign - "$APP_PATH"

          mkdir -p build/package/Payload
          cp -R "$APP_PATH" build/package/Payload/LichessCN.app
          cd build/package
          zip -r9 ../LichessHybrid-v6.ipa Payload
          cd ../..
          ls -lh build/LichessHybrid-v6.ipa

      - name: Publish LichessHybrid-v6.ipa to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.0.${{ github.run_number }}
          name: "LichessHybrid v6.0.${{ github.run_number }} (新增研习译文自动/手动语音朗读)"
          make_latest: true
          body: |
            ### 🔊 LichessHybrid v6.0 新增功能：研习译文自动/手动语音朗读
            - **走子自动朗读**：默认开启走子自动语音播报，每走一步棋或点击「下一页」完成翻译后，自动朗读最新中文解说（可在顶部菜单一键开关）。
            - **网页内嵌 `[🔊 朗读]` 按钮 + 顶部栏一键播报/停止**：每个翻译后的解说框末尾均附带 **`[🔊 朗读]`** 按钮，顶部工具栏也配有独立的 **`🔊 自动读 / 停止`** 快捷按钮。
            - **国际象棋谱号智能口语化**：自动将译文中的 `O-O` 读作“短易位”、`O-O-O` 读作“长易位”、`Bd2` 读作“象 d2”、`Qc2` 读作“后 c2”、`Bxf7+` 读作“象吃 f7 将军”，并支持在 iPhone 开启静音键时正常发声。
          files: |
            build/LichessHybrid-v6.ipa
