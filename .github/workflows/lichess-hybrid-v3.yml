      - name: Commit Hybrid v3 Source Files to Repository
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A project.yml README.md LichessCN/
            git commit -m "feat(v3): switch to native SwiftUI shell + WKWebView + JS Study translation bridge [skip ci]"
            git push origin HEAD || true
          fi

      - name: Select Xcode Stable
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen & ldid
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          if ! command -v ldid &> /dev/null; then
            brew install ldid
          fi

      - name: Generate Xcode Project via XcodeGen
        run: |
          xcodegen generate --spec project.yml

      - name: Build Unsigned Release App for iOS
        run: |
          xcodebuild clean build \
            -project LichessCN.xcodeproj \
            -scheme LichessCN \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            PRODUCT_BUNDLE_IDENTIFIER="com.lichess.studyapp" \
            INFOPLIST_KEY_CFBundleDisplayName="LichessStudy" \
            INFOPLIST_KEY_CFBundleName="LichessStudy" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Verify Pure ASCII Info.plist & Package LichessHybrid-v3.ipa
        run: |
          APP_PATH=$(find build/DerivedData -name "LichessCN.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: LichessCN.app not found!"
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleName LichessStudy" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName LichessStudy" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.lichess.studyapp" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion en" "$APP_PATH/Info.plist"

          rm -rf "$APP_PATH/embedded.mobileprovision"
          ldid -S "$APP_PATH/LichessCN" || codesign --force --deep --sign - "$APP_PATH"

          mkdir -p build/package/Payload
          cp -R "$APP_PATH" build/package/Payload/LichessCN.app
          cd build/package
          zip -r9 ../LichessHybrid-v3.ipa Payload
          cd ../..
          ls -lh build/LichessHybrid-v3.ipa

      - name: Publish LichessHybrid-v3.ipa to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: "LichessHybrid v3.0.${{ github.run_number }} (WKWebView 原版体验 + JS 研习实时翻译)"
          make_latest: true
          body: |
            ### ♟️ LichessHybrid v3.0 (原生壳 + WKWebView + 注入式 JS 实时研习翻译)
            - **完整复用 Lichess 官方网页版**：原汁原味的 `chessground` 棋盘手感、音效、在线寻局、谜题、本地 Stockfish WASM 引擎与账号登录。
            - **研习章节与注解实时拦截翻译**：注入 `MutationObserver` 脚本，浏览任何 Lichess Study 时自动在网页内嵌显示中文精译，并配备底部原生悬浮双语字幕卡与多翻译引擎切换（GTX 极速 / Pollinations AI 大模型 / Lingva / MyMemory）。
            - **SideStore 直装**：下载下方 **`LichessHybrid-v3.ipa`** 导入 SideStore 即可签名安装（已锁定纯英文 `LichessStudy` 标识）。
          files: |
            build/LichessHybrid-v3.ipa
