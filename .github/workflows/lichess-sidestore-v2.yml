      - name: Sync Fixed v2 Source Files to Repository
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A project.yml README.md LichessCN/
            git commit -m "fix(v2): set pure ASCII LichessStudy appIdName and com.lichess.studyapp bundleId [skip ci]"
            git push origin HEAD || true
          fi

      - name: Select Xcode Stable
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen & ldid
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          if ! command -v ldid &> /dev/null; then
            brew install ldid
          fi

      - name: Generate Xcode Project via XcodeGen
        run: |
          xcodegen generate --spec project.yml

      - name: Build Unsigned Release App for iOS
        run: |
          xcodebuild clean build \
            -project LichessCN.xcodeproj \
            -scheme LichessCN \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            PRODUCT_BUNDLE_IDENTIFIER="com.lichess.studyapp" \
            INFOPLIST_KEY_CFBundleDisplayName="LichessStudy" \
            INFOPLIST_KEY_CFBundleName="LichessStudy" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Verify Pure ASCII Info.plist & Package LichessStudy-v2.ipa
        run: |
          APP_PATH=$(find build/DerivedData -name "LichessCN.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: LichessCN.app not found!"
            exit 1
          fi

          # Force pure ASCII values in compiled binary Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName LichessStudy" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName LichessStudy" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.lichess.studyapp" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion en" "$APP_PATH/Info.plist"

          echo "=== 最终打包前二进制 Info.plist 校验 ==="
          plutil -p "$APP_PATH/Info.plist"
          if plutil -p "$APP_PATH/Info.plist" | grep -q "研习"; then
            echo "错误：Info.plist 中仍检测到中文字符！"
            exit 1
          fi

          rm -rf "$APP_PATH/embedded.mobileprovision"
          ldid -S "$APP_PATH/LichessCN" || codesign --force --deep --sign - "$APP_PATH"

          mkdir -p build/package/Payload
          cp -R "$APP_PATH" build/package/Payload/LichessCN.app
          cd build/package
          zip -r9 ../LichessStudy-v2.ipa Payload
          cd ../..
          ls -lh build/LichessStudy-v2.ipa

      - name: Publish LichessStudy-v2.ipa to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "LichessStudy v2.0.${{ github.run_number }} (纯英文 AppIdName 修复版)"
          make_latest: true
          body: |
            ### ✅ 已彻底修复 SideStore `appIdName` 报错 (v2.0.${{ github.run_number }})
            - **重要提示**：请下载下方全新命名的 **`LichessStudy-v2.ipa`**（切勿在手机「文件」App 中误选之前下载的旧版 `LichessCN-SideStore.ipa`）。
            - 本版本已将 `CFBundleName` 与 `CFBundleDisplayName` 强制锁定为纯英文 `LichessStudy`，并将 Bundle ID 更新为 `com.lichess.studyapp`，彻底规避旧包缓存与中文 `appIdName` 报错。
          files: |
            build/LichessStudy-v2.ipa
