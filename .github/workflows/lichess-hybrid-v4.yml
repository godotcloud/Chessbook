      - name: Commit Hybrid v4 Source Files to Repository
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A project.yml README.md LichessCN/
            git commit -m "feat(v4): optimize gamebook/chapter layout, slim top bar, and chess glossary [skip ci]"
            git push origin HEAD || true
          fi

      - name: Select Xcode Stable
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen & ldid
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          if ! command -v ldid &> /dev/null; then
            brew install ldid
          fi

      - name: Generate Xcode Project via XcodeGen
        run: |
          xcodegen generate --spec project.yml

      - name: Build Unsigned Release App for iOS
        run: |
          xcodebuild clean build \
            -project LichessCN.xcodeproj \
            -scheme LichessCN \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            PRODUCT_BUNDLE_IDENTIFIER="com.lichess.studyapp" \
            INFOPLIST_KEY_CFBundleDisplayName="LichessStudy" \
            INFOPLIST_KEY_CFBundleName="LichessStudy" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Verify Pure ASCII Info.plist & Package LichessHybrid-v4.ipa
        run: |
          APP_PATH=$(find build/DerivedData -name "LichessCN.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: LichessCN.app not found!"
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleName LichessStudy" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName LichessStudy" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.lichess.studyapp" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion en" "$APP_PATH/Info.plist"

          rm -rf "$APP_PATH/embedded.mobileprovision"
          ldid -S "$APP_PATH/LichessCN" || codesign --force --deep --sign - "$APP_PATH"

          mkdir -p build/package/Payload
          cp -R "$APP_PATH" build/package/Payload/LichessCN.app
          cd build/package
          zip -r9 ../LichessHybrid-v4.ipa Payload
          cd ../..
          ls -lh build/LichessHybrid-v4.ipa

      - name: Publish LichessHybrid-v4.ipa to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.${{ github.run_number }}
          name: "LichessHybrid v4.0.${{ github.run_number }} (清爽界面排版 & 防遮挡优化版)"
          make_latest: true
          body: |
            ### ✨ LichessHybrid v4.0 界面与翻译优化亮点
            - **修复「下一页」绿按钮与蓝章鱼遮挡文字**：重构 `.gamebook` Flex 布局，解说框独立滑动，绿底「下一页」按钮固定在下方不再压住文字，蓝章鱼图标缩小淡化。
            - **默认「清爽中文 + 点击看原文」模式**：直接将冗长英文替换为中文，末尾附带小巧的 **`[原文]`** 展开按钮，高度减半不拥挤（可在顶部菜单随时切回上下双语同显）。
            - **修复棋盘顶部被切与章节列表截断**：移除占空间的底部导航栏（整合至顶部 36pt 超薄栏，支持一键全屏隐藏），棋盘 8 行完整展现；章节标题改为 `中文 · English` 自适应行高。
            - **国际象棋术语精修**：自动将“古典变奏”修正为“古典变例”、“这种辩护”修正为“这种防御”、“这项研究”修正为“本研习”。
          files: |
            build/LichessHybrid-v4.ipa
